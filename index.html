<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bharpai.com</title>
  <meta name="description" content="bharpai.com — serious inquiries only.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2309090b'/><text x='50' y='70' font-family='Georgia,serif' font-style='italic' font-size='64' text-anchor='middle' fill='%23e8dcc4'>b</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --fg: #f4f1ea;
      --muted: #8a8780;
      --accent: #e8dcc4;
      --line: rgba(244, 241, 234, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    /* Slow-moving ambient glow */
    .glow {
      position: fixed; inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(40% 35% at 30% 35%, rgba(232, 220, 196, 0.10), transparent 70%),
        radial-gradient(35% 30% at 70% 65%, rgba(140, 120, 255, 0.08), transparent 70%);
      filter: blur(40px);
      animation: drift 22s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-3%, -2%, 0) rotate(0deg); }
      to   { transform: translate3d(3%, 2%, 0) rotate(8deg); }
    }

    /* Film grain */
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.06;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    main {
      position: relative;
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    .mark {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(56px, 14vw, 120px);
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, var(--fg) 30%, rgba(244, 241, 234, 0.55));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) 0.1s forwards;
    }
    .mark span { color: var(--muted); -webkit-text-fill-color: rgba(244,241,234,0.35); }

    .rule {
      width: 0; height: 1px; margin: 40px auto;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      animation: grow 1.4s cubic-bezier(.2,.7,.2,1) 0.5s forwards;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 1s cubic-bezier(.2,.7,.2,1) 0.8s forwards;
    }

    .contact {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: rise 1s cubic-bezier(.2,.7,.2,1) 1s forwards;
    }

    .email {
      position: relative;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(24px, 5.5vw, 36px);
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .email::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .5s cubic-bezier(.2,.7,.2,1);
    }
    .email:hover::after, .email:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    .email:focus-visible { outline: none; }

    .copy {
      flex: none;
      display: grid; place-items: center;
      width: 36px; height: 36px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
    }
    .copy:hover, .copy:focus-visible {
      color: var(--fg);
      border-color: rgba(244,241,234,0.35);
      background: rgba(255,255,255,0.05);
      outline: none;
    }
    .copy svg { width: 15px; height: 15px; }
    .copy .check { display: none; }
    .copy.done .check { display: block; color: var(--accent); }
    .copy.done .clip { display: none; }

    footer {
      position: fixed; bottom: 24px; left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(138,135,128,0.6);
      opacity: 0;
      animation: rise 1s ease 1.4s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    @keyframes grow { to { width: min(220px, 60%); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; }
      .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <h1 class="mark">bharpai<span>.com</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="label">Serious inquiries only</p>
    <div class="contact">
      <a class="email" href="mailto:taherminator@gmail.com?subject=Inquiry%20about%20bharpai.com">taherminator@gmail.com</a>
      <button class="copy" type="button" aria-label="Copy email address" title="Copy">
        <svg class="clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </main>

  <footer>© <span id="y">2026</span></footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const btn = document.querySelector('.copy');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('taherminator@gmail.com');
        btn.classList.add('done');
        btn.setAttribute('aria-label', 'Copied');
        setTimeout(() => { btn.classList.remove('done'); btn.setAttribute('aria-label', 'Copy email address'); }, 1800);
      } catch (e) {}
    });
  </script>
</body>
</html>
